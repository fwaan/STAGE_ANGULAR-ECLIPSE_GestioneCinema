<a [routerLink]="['/details', film().title]">
  <mat-card
    class="film-card h-100"
    appearance="raised"
    [routerLink]="['/film', film().id]"
    tabindex="0"
  >
    <img mat-card-image [src]="posterUrl | async" [alt]="film().title" />

    <mat-card-header>
      <mat-card-title>{{ film().title }}</mat-card-title>
      <mat-card-subtitle>{{ film().genre }}</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content class="film-footer">
      <span class="duration"
        ><mat-icon>hourglass</mat-icon>{{ film().duration_in_minutes + ' min' }}</span
      >

      <span class="more">Dettagli <mat-icon>chevron_right</mat-icon></span>
    </mat-card-content>
  </mat-card>
</a>
